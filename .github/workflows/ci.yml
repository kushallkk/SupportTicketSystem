name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      # `prisma generate` never connects, but prisma.config.ts fails if this variable is missing.
      DATABASE_URL: postgresql://user:password@localhost:5432/ci
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # Informational for now: existing hooks trip the strict React rules (set-state-in-effect, refs).
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

  ml-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements-dev.txt
      - name: Install CPU-only torch first (much smaller than the default CUDA wheel)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - name: Cache the sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - name: Tests
        run: python -m pytest -q

  # Needs a disposable Postgres. Add a repo secret TEST_DATABASE_URL (a throwaway Neon project;
  # tests TRUNCATE every table in it). Without the secret these steps are skipped, not failed.
  # Fork PRs never receive secrets, so they skip too.
  database-tests:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      DATABASE_URL: postgresql://user:password@localhost:5432/ci  # placeholder for `prisma generate` only
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: env.TEST_DATABASE_URL != ''
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: env.TEST_DATABASE_URL != ''
        run: npm ci && npx prisma generate
      - name: Integration tests (API routes + real Postgres)
        if: env.TEST_DATABASE_URL != ''
        run: npm run test:integration
      - name: Install Playwright Chromium
        if: env.TEST_DATABASE_URL != ''
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (browser)
        if: env.TEST_DATABASE_URL != ''
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
